<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>History Sweep · 更新横幅</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f2f2f2; color: #2e2e2f; font: 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
    main { max-width: 1000px; margin: auto; }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { color: #727272; line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 24px; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; background: #e4e4e4; color: #2e2e2f; font: inherit; cursor: pointer; }
    button[aria-pressed=true] { background: #252525; color: white; }
    .comparison { display: grid; grid-template-columns: 440px 440px; gap: 28px; align-items: start; }
    h2 { font-size: 13px; font-weight: 500; margin: 0 0 12px; }
    .source { position: relative; width: 440px; height: 644px; overflow: hidden; border-radius: 14px; }
    .source img { position: absolute; width: 1300px; max-width: none; left: -180px; top: -116px; }
    iframe { display: block; width: 440px; height: 590px; border: 0; border-radius: 14px; }
    .note { max-width: 700px; font-size: 12px; }
    @media (max-width: 960px) { .comparison { grid-template-columns: 440px; } .reference { display: none; } }
  </style>
</head>
<body>
  <main>
    <h1>History Sweep · 更新横幅</h1>
    <p>从顶部落下，轻微回弹；任务进行时等待删除与复查完成。</p>
    <nav aria-label="预览状态">
      <button id="idle" aria-pressed="true">空闲状态</button>
      <button id="task" aria-pressed="false">任务中出现</button>
      <button id="reduce" aria-pressed="false">减少动态效果</button>
      <button id="replay">重播动画</button>
      <button id="repeat">重复通知</button>
      <button id="fail">模拟更新失败</button>
    </nav>
    <div class="comparison">
      <section class="reference"><h2>已确认的设计</h2><div class="source"><img src="reference.png" alt="已确认的更新横条设计"></div></section>
      <section><h2>实际交互预览</h2><iframe id="preview" src="popup.html" title="更新横幅交互预览"></iframe></section>
    </div>
    <p class="note">仅使用示例历史数据与模拟商店通知。点击横幅中的更新按钮只模拟重新加载，不操作已安装插件。</p>
  </main>
  <script>
    const frame = document.getElementById('preview');
    let state = 'idle';
    let run = 0;
    function replay() {
      document.querySelector('.source img').style.left = state === 'task' ? '-681px' : '-180px';
      frame.src = `popup.html?state=${state}&run=${++run}`;
    }
    for (const id of ['idle', 'task', 'reduce']) document.getElementById(id).onclick = () => {
      state = id;
      for (const choice of ['idle', 'task', 'reduce']) document.getElementById(choice).setAttribute('aria-pressed', String(choice === state));
      replay();
    };
    document.getElementById('replay').onclick = replay;
    document.getElementById('repeat').onclick = () => frame.contentWindow.postMessage('repeat-update-event', location.origin);
    document.getElementById('fail').onclick = () => frame.contentWindow.postMessage('fail-update', location.origin);
  </script>
</body>
</html>
